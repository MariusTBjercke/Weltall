[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Weltall
; This fork's own build: the numbers the release had, plus a suffix that shows on the title screen and in
; the version the game shows, so a build of the fork is never mistaken for the release. Bump the numbers
; when a set of changes becomes a release of its own.
ProjectVersion=1.0.1-fork.1

[/Script/UnrealEd.ProjectPackagingSettings]
; The editor's own content (its meshes, materials and tools) is never loaded by the game.
bSkipEditorContent=True
; The port's own story documents are text the game reads as it starts, and its example scenes text it copies to Mods.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Story")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Examples")
